# =====================================================================
#  STARTER — editable content (YAML)
# =====================================================================
#  Edit this file, then run:  python3 build.py
#  Keys are English (code); values are the content language.
#  Indent with SPACES (never tabs). Keep texts in "double quotes".
# =====================================================================

slug: "client-project-a4"          # base of every output file name: <client>-<project>-<size>
title: "Document title"        # PDF metadata
author: ""                    # who made the file (your name or studio) -> PDF Author. Empty = the AI asks.
client: "Client name"      # PDF Subject metadata
lang: "en"                     # PDF language (pt-BR, en, ...)
targets: [print, web]         # deliverables of this project (set once): print, web or both
bleed_mm: 0                    # only sets Trim/BleedBox; make `page` larger for a real bleed
page: {width_mm: 210, height_mm: 297}   # any size (A4 shown)
web: {dpi: 150, quality: 80}   # optimized web version: image dpi / JPEG quality

# sRGB hex. print -> converted to CMYK FOGRA39; web -> kept as sRGB.
colors:
  primary: "#1F6FEB"
  accent: "#F5A524"
  text: "#1B1B1B"
  muted: "#6B6B6B"

# ---- example layout content (build.py reads these; change freely with the layout)
header: "Studio name"
heading: "A clear heading"
intro: "Replace this text with the real content. Everything on the page comes from this file, so edits never touch the layout code."
items:
  - ["First item", "10,00"]
  - ["Second item", "25,00"]
  - ["Third item with a longer name that wraps when needed", "40,00"]
photo: {file: "assets/images/placeholder.jpg", focus_y: 0.5}
