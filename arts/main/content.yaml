# =====================================================================
#  ART CONTENT — editable (YAML)
# =====================================================================
#  Edit this file, then run:  python3 arts/<this-folder>/build.py
#  Shared keys (author, client, lang, colors, web) live in ../../brand.yaml; set any of them
#  here only to override them for this art.
#  Keys are English (code); values are the content language.
#  Indent with SPACES (never tabs). Keep texts in "double quotes".
# =====================================================================

slug: "client-project-a4"          # base of every output file name: <kit-name>-<art-folder>, e.g. acme-menu-a4
version: 1                     # bump when you deliver a new version to the client (or: --bump)
title: "Document title"        # PDF metadata
targets: [print, web]         # deliverables of this art (set once): print, web or both
bleed_mm: 0                    # real bleed: >0 makes the PDF page larger; draw() backgrounds extend by ctx.bleed
page: {width_mm: 210, height_mm: 297}   # any size (A4 shown)

# ---- example layout content (build.py reads these; change freely with the layout)
header: "Studio name"
heading: "A clear heading"
intro: "Replace this text with the real content. Everything on the page comes from this file, so edits never touch the layout code."
items:
  - ["Pão de queijo", "10,00"]
  - ["Açaí com granola", "25,00"]
  - ["Third item with a longer name that wraps when needed", "40,00"]
photo: {file: "assets/images/placeholder.jpg", focus_y: 0.5}
